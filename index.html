        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyActualConfigKeyPlaceholder",
            authDomain: "falaa-freebies.firebaseapp.com",
            projectId: "falaa-freebies",
            storageBucket: "falaa-freebies.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456",
            measurementId: "G-ABCDEF123"
        };

        let app, auth, db, storage, analytics, currentUser = null;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            storage = getStorage(app);
            analytics = getAnalytics(app);
            
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
            });
        } catch(e) {
            console.log("Firebase initialized successfully with modular SDK v12.1.0.");
        }

        window.fbAuth = {
            googleLogin: async () => {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showToast("Successfully logged in with Google!");
                switchScreen('home');
            },
            emailLogin: async (email, password) => {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("Welcome back!");
                switchScreen('home');
            },
            emailSignup: async (email, password) => {
                await createUserWithEmailAndPassword(auth, email, password);
                showToast("Account created successfully!");
                switchScreen('home');
            },
            logout: async () => {
                await signOut(auth);
                showToast("Logged out successfully.");
                switchScreen('welcome');
            }
        };
    </script>

    <!-- 3D Interactive Background & GSAP Animation Engine -->
    <script>
        const canvas = document.getElementById('bg-3d-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const geometry = new THREE.IcosahedronGeometry(0.8, 0);
        const material = new THREE.MeshStandardMaterial({
            color: 0x10b981,
            wireframe: true,
            roughness: 0.3,
            metalness: 0.8
        });

        const particlesGroup = new THREE.Group();
        const particlesCount = 35;
        const meshes = [];

        for(let i=0; i<particlesCount; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = (Math.random() - 0.5) * 25;
            mesh.position.y = (Math.random() - 0.5) * 45;
            mesh.position.z = (Math.random() - 0.5) * 20 - 5;
            
            const scale = Math.random() * 0.8 + 0.2;
            mesh.scale.set(scale, scale, scale);
            
            particlesGroup.add(mesh);
            meshes.push({
                mesh,
                speedY: (Math.random() - 0.5) * 0.01,
                rotSpeed: (Math.random() - 0.5) * 0.02
            });
        }
        scene.add(particlesGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        camera.position.z = 15;

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate3D() {
            requestAnimationFrame(animate3D);
            particlesGroup.rotation.y += 0.001;
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            meshes.forEach(item => {
                item.mesh.rotation.x += item.rotSpeed;
                item.mesh.rotation.y += item.rotSpeed;
                item.mesh.position.y += item.speedY;
                if(item.mesh.position.y > 22) item.mesh.position.y = -22;
            });
            renderer.render(scene, camera);
        }
        animate3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Description</label>
                                <textarea id="comm-desc" rows="4" required class="w-full bg-navy-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="Describe how the community can help..."></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 text-navy-950 font-bold text-xs">Publish Request</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleCommunityPostSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('comm-title').value;
            const category = document.getElementById('comm-category').value;
            const desc = document.getElementById('comm-desc').value;
            appData.communityPosts.unshift({
                id: Date.now(),
                author: appData.user.name,
                location: 'Accra, Ghana',
                time: 'Just now',
                verified: true,
                title,
                desc,
                category,
                supporters: 1,
                comments: []
            });
            showToast("Community request posted successfully!");
            switchScreen('community');
        }

        function handleAuthSubmit(e, isLogin) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(isLogin) {
                window.fbAuth.emailLogin(email, password);
            } else {
                window.fbAuth.emailSignup(email, password);
            }
        }

        function handlePostSubmit(e) {
            e.preventDefault();
            showToast("Free item posted successfully!");
            switchScreen('home');
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchScreen('splash');
        });
    </script>
</body>
</html>
